<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - Shared Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        google: {
                            blue: '#1a73e8',
                            hover: '#1557b0',
                            light: '#f1f3f4',
                            dark: '#1f1f1f',
                            border: '#dadce0',
                            darkBorder: '#3c4043',
                            darkSurface: '#1e1f20'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #444746; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-google-dark text-gray-800 dark:text-gray-200 h-screen flex flex-col overflow-hidden select-none font-sans transition-colors duration-200">

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 dark:bg-[#121212]">
        <div class="bg-white dark:bg-google-darkSurface p-8 rounded-3xl shadow-xl border border-gray-200/80 dark:border-google-darkBorder w-full max-w-sm backdrop-blur-xl">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 dark:bg-blue-900/20 text-google-blue rounded-2xl mb-4 text-3xl shadow-inner">
                    <i class="fa-brands fa-google-drive"></i>
                </div>
                <h1 class="text-xl font-semibold tracking-tight">Ares Engineering Digital Library</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Masuk dengan akun terdaftar</p>
            </div>

            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Username</label>
                    <input type="text" id="login-username" placeholder="Masukkan username..." class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-google-blue focus:bg-white dark:focus:bg-gray-900 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Password</label>
                    <input type="password" id="login-password" placeholder="••••••" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-google-blue focus:bg-white dark:focus:bg-gray-900 transition">
                </div>
                <div id="login-error" class="text-xs text-red-500 font-medium hidden text-center"></div>
            </div>

            <button onclick="handleLogin()" class="w-full bg-google-blue hover:bg-google-hover text-white font-medium py-3 px-4 rounded-xl transition shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk
            </button>
        </div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-full w-full">
        <header class="flex items-center justify-between h-16 px-4 border-b border-gray-200 dark:border-google-darkBorder bg-white dark:bg-google-darkSurface shrink-0 shadow-xs z-20">
            <div class="flex items-center gap-3 w-72">
                <div class="flex items-center gap-2.5 cursor-pointer pl-1" onclick="loadDriveData('root')">
                    <i class="fa-brands fa-google-drive text-2xl text-google-blue"></i>
                    <span class="text-lg font-medium tracking-tight">Ares Engineering Digital Library</span>
                </div>
            </div>

            <div class="flex-1 max-w-2xl px-4">
                <div class="relative flex items-center bg-gray-100 dark:bg-[#2b2d30] rounded-full hover:bg-white hover:shadow-md dark:hover:bg-[#323538] transition-all border border-transparent hover:border-gray-200 dark:hover:border-gray-700">
                    <span class="absolute left-4 text-gray-500 dark:text-gray-400"><i class="fa-solid fa-magnifying-glass text-sm"></i></span>
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Telusuri di Drive Bersama" class="w-full bg-transparent py-2.5 pl-12 pr-4 text-sm outline-none text-gray-800 dark:text-gray-100 placeholder-gray-500">
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 transition" title="Mode Terang / Gelap">
                    <i id="theme-icon" class="fa-solid fa-moon text-base"></i>
                </button>
                
                <div class="flex items-center gap-3 pl-2 border-l border-gray-200 dark:border-gray-700">
                    <div class="flex items-center gap-2.5 bg-gray-50 dark:bg-gray-800/60 py-1.5 px-3 rounded-full border border-gray-200/60 dark:border-gray-700">
                        <div id="current-user-avatar" class="w-7 h-7 rounded-full bg-google-blue text-white flex items-center justify-center font-bold text-xs shadow-xs">U</div>
                        <span id="current-user-name" class="text-xs font-semibold">User</span>
                    </div>
                    <button onclick="handleLogout()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/20 dark:text-red-400 px-3 py-2 rounded-xl transition font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i> Keluar
                    </button>
                </div>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <aside class="w-64 p-3 flex flex-col justify-between shrink-0 border-r border-gray-200 dark:border-google-darkBorder bg-white dark:bg-google-darkSurface">
                <div class="space-y-4 overflow-y-auto custom-scrollbar flex-1 pr-1">
                    <div class="relative">
                        <button onclick="openNewMenu()" class="flex items-center gap-4 bg-white dark:bg-[#2b2d30] hover:shadow-md border border-gray-200/80 dark:border-gray-700 px-6 py-3.5 rounded-2xl text-sm font-medium transition group w-full">
                            <svg width="24" height="24" viewBox="0 0 36 36"><path fill="#34A853" d="M16 16v14h4V20z"></path><path fill="#4285F4" d="M30 16H20l-4 4h14z"></path><path fill="#FBBC05" d="M6 16h10l4 4H6z"></path><path fill="#EA4335" d="M20 16V2h-4v14z"></path></svg>
                            <span class="font-semibold text-gray-700 dark:text-gray-200">Baru</span>
                            <i class="fa-solid fa-chevron-down text-xs ml-auto text-gray-400 group-hover:rotate-180 transition-transform"></i>
                        </button>
                        
                        <div id="new-dropdown" class="hidden absolute left-0 top-16 w-full bg-white dark:bg-[#282a2d] rounded-2xl shadow-xl border border-gray-200 dark:border-google-darkBorder py-2 z-30 overflow-hidden">
                            <button onclick="triggerUploadFile()" class="w-full text-left px-4 py-3 text-xs font-medium hover:bg-gray-100 dark:hover:bg-gray-700/60 flex items-center gap-3 transition">
                                <i class="fa-solid fa-file-arrow-up text-google-blue text-sm"></i> Upload File
                            </button>
                            <button onclick="openNewFolderModal()" class="w-full text-left px-4 py-3 text-xs font-medium hover:bg-gray-100 dark:hover:bg-gray-700/60 flex items-center gap-3 transition">
                                <i class="fa-solid fa-folder-plus text-google-blue text-sm"></i> Folder Baru
                            </button>
                        </div>
                        <input type="file" id="hidden-file-input" class="hidden" onchange="uploadFileScript(event)">
                    </div>

                    <nav class="space-y-1">
                        <a href="#" onclick="loadDriveData('root', 'Drive Utama Library')" class="flex items-center gap-3.5 px-4 py-2.5 rounded-full text-xs font-semibold transition" id="nav-root">
                            <i class="fa-solid fa-hard-drive w-4 text-center"></i> Drive Bersama
                        </a>
                    </nav>

                    <div class="pt-2">
                        <div class="text-[11px] font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 px-4 mb-2 flex items-center justify-between">
                            <span>Folder Utama</span>
                            <i class="fa-solid fa-folder-open text-xs"></i>
                        </div>
                        <div id="sidebar-folders-list" class="space-y-0.5"></div>
                    </div>
                </div>
            </aside>

            <main class="flex-1 flex flex-col bg-white dark:bg-google-dark overflow-hidden">
                <div class="flex items-center justify-between px-6 py-3.5 border-b border-gray-200 dark:border-google-darkBorder shrink-0 bg-white dark:bg-google-dark">
                    <div id="breadcrumb-container" class="flex items-center gap-2 text-sm font-medium">
                        <span class="text-gray-500 dark:text-gray-400 cursor-pointer hover:underline" onclick="loadDriveData('root', 'Drive Utama Library')">Drive Utama Library</span>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="flex bg-gray-100 dark:bg-gray-800 rounded-xl p-1 border border-gray-200/60 dark:border-gray-700">
                            <button onclick="setViewMode('grid')" id="btn-grid" class="p-1.5 px-3 rounded-lg text-xs font-medium bg-white dark:bg-gray-700 shadow-xs transition">
                                <i class="fa-solid fa-border-all mr-1.5"></i> Grid
                            </button>
                            <button onclick="setViewMode('list')" id="btn-list" class="p-1.5 px-3 rounded-lg text-xs font-medium text-gray-500 dark:text-gray-400 transition">
                                <i class="fa-solid fa-list mr-1.5"></i> List
                            </button>
                        </div>
                        <button onclick="loadDriveData(currentFolderId, folderHistory[folderHistory.length - 1].name)" class="w-9 h-9 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition" title="Refresh">
                            <i class="fa-solid fa-rotate text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                    <div id="loading-indicator" class="text-center py-16 text-gray-400 text-sm flex flex-col items-center gap-2">
                        <i class="fa-solid fa-spinner animate-spin text-2xl text-google-blue"></i>
                        Memuat data dari Google Drive...
                    </div>
                    
                    <div id="folders-container" class="mb-6 hidden">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3 px-1">Folder</h3>
                        <div id="folders-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
                    </div>

                    <div id="files-section" class="hidden">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3 px-1">File</h3>
                        <div id="files-container"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="preview-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white dark:bg-google-darkSurface rounded-3xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden shadow-2xl border border-gray-200 dark:border-google-darkBorder animate-in fade-in zoom-in-95 duration-150">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-google-darkBorder bg-gray-50/50 dark:bg-google-darkSurface">
                <h3 id="preview-title" class="font-semibold text-sm truncate">Nama File</h3>
                <div class="flex items-center gap-2">
                    <a id="preview-download-btn" href="#" target="_blank" class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full text-gray-600 dark:text-gray-300 transition text-xs flex items-center gap-1.5 px-3 bg-gray-100 dark:bg-gray-800 font-medium" title="Buka di Google Drive">
                        <i class="fa-solid fa-external-link"></i> Buka Drive
                    </a>
                    <button onclick="closePreview()" class="w-9 h-9 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full text-gray-600 dark:text-gray-300 transition">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 bg-gray-100/50 dark:bg-black/40 flex items-center justify-center overflow-auto p-4" id="preview-content-area"></div>
        </div>
    </div>

    <div id="folder-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white dark:bg-google-darkSurface rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-gray-200 dark:border-google-darkBorder">
            <h3 class="font-semibold text-base mb-4">Buat Folder Baru</h3>
            <input type="text" id="new-folder-name" placeholder="Nama folder..." class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-3 text-sm mb-6 outline-none focus:border-google-blue transition">
            <div class="flex justify-end gap-2.5">
                <button onclick="closeNewFolderModal()" class="px-4 py-2 text-xs font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl transition">Batal</button>
                <button onclick="createFolderScript()" class="px-4 py-2 text-xs font-semibold bg-google-blue hover:bg-google-hover text-white rounded-xl transition shadow-xs">Buat</button>
            </div>
        </div>
    </div>

    <script>
        const USERS_DB = [
            { username: 'aresmaintenance', password: 'aresmaintenance123', name: 'Ares Maintenance', avatar: 'AM', role: 'Maintenance Team' },
            { username: 'aresproject', password: 'aresproject456', name: 'Ares Project', avatar: 'AP', role: 'Project Team' },
            { username: 'aresautomation', password: 'aresautomation789', name: 'Ares Automation', avatar: 'AA', role: 'Automation Team' },
            { username: 'aressparepart', password: 'aressparepart012', name: 'Ares Sparepart', avatar: 'AS', role: 'Sparepart Team' }
        ];

        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2h6pJdJmY7RmaLpiR859Izf3Q7KIE-xK9IBZPnl9M-kVvQPoyEdXQTZdvrQp4bK0/exec"; 
        let currentUser = null;
        let driveFolders = [];
        let driveFiles = [];
        let rootSidebarFolders = [];
        let viewMode = 'grid';
        let currentFolderId = 'root';
        let folderHistory = [{ id: 'root', name: 'Drive Utama Library' }];

        window.onload = function() {
            const savedUser = localStorage.getItem('shared_drive_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                startApp();
            }
        };

        function handleLogin() {
            const uInput = document.getElementById('login-username').value.trim().toLowerCase();
            const pInput = document.getElementById('login-password').value.trim();
            const errEl = document.getElementById('login-error');

            const found = USERS_DB.find(u => u.username === uInput && u.password === pInput);
            if (found) {
                currentUser = found;
                localStorage.setItem('shared_drive_user', JSON.stringify(currentUser));
                startApp();
            } else {
                errEl.innerText = "Username atau Password salah!";
                errEl.classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('shared_drive_user');
            location.reload();
        }

        function startApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            document.getElementById('current-user-avatar').innerText = currentUser.avatar;
            document.getElementById('current-user-name').innerText = currentUser.name;

            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun text-base';
            }

            fetchRootFoldersForSidebar();
            loadDriveData('root', 'Drive Utama Library');
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-base' : 'fa-solid fa-moon text-base';
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btn-grid').className = mode === 'grid' ? "p-1.5 px-3 rounded-lg text-xs font-medium bg-white dark:bg-gray-700 shadow-xs transition" : "p-1.5 px-3 rounded-lg text-xs font-medium text-gray-500 dark:text-gray-400 transition";
            document.getElementById('btn-list').className = mode === 'list' ? "p-1.5 px-3 rounded-lg text-xs font-medium bg-white dark:bg-gray-700 shadow-xs transition" : "p-1.5 px-3 rounded-lg text-xs font-medium text-gray-500 dark:text-gray-400 transition";
            renderUI();
        }

        function fetchRootFoldersForSidebar() {
            fetch(`${APPS_SCRIPT_URL}?action=getData&folderId=root`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    rootSidebarFolders = data.folders;
                    renderSidebarFolders();
                }
            });
        }

        function renderSidebarFolders() {
            const sidebarList = document.getElementById('sidebar-folders-list');
            const isRootActive = currentFolderId === 'root';
            
            const navRoot = document.getElementById('nav-root');
            navRoot.className = isRootActive 
                ? "flex items-center gap-3.5 px-4 py-2.5 rounded-full text-xs font-semibold bg-blue-50 dark:bg-blue-900/30 text-google-blue dark:text-blue-400 transition"
                : "flex items-center gap-3.5 px-4 py-2.5 rounded-full text-xs font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800/60 transition";

            sidebarList.innerHTML = rootSidebarFolders.map(f => {
                const isActive = currentFolderId === f.id;
                const activeClass = isActive 
                    ? "bg-blue-50 dark:bg-blue-900/30 text-google-blue dark:text-blue-400 font-semibold" 
                    : "text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800/60 font-medium";
                
                return `
                    <a href="#" onclick="loadDriveData('${f.id}', '${f.name}')" class="flex items-center gap-3 px-4 py-2 rounded-full text-xs transition ${activeClass}">
                        <i class="fa-solid fa-folder text-google-blue w-4 text-center"></i>
                        <span class="truncate">${f.name}</span>
                    </a>
                `;
            }).join('');
        }

        function loadDriveData(folderId = 'root', folderName = 'Drive Utama Library') {
            currentFolderId = folderId;
            
            if (folderId === 'root') {
                folderHistory = [{ id: 'root', name: 'Drive Utama Library' }];
            } else {
                const existingIdx = folderHistory.findIndex(f => f.id === folderId);
                if (existingIdx !== -1) {
                    folderHistory = folderHistory.slice(0, existingIdx + 1);
                } else {
                    folderHistory.push({ id: folderId, name: folderName });
                }
            }

            renderSidebarFolders();

            document.getElementById('loading-indicator').style.display = 'flex';
            document.getElementById('folders-container').classList.add('hidden');
            document.getElementById('files-section').classList.add('hidden');

            fetch(`${APPS_SCRIPT_URL}?action=getData&folderId=${folderId}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading-indicator').style.display = 'none';
                if(data.success) {
                    driveFolders = data.folders;
                    driveFiles = data.files;
                    renderUI();
                }
            }).catch(() => {
                document.getElementById('loading-indicator').innerHTML = "<span class='text-red-500'>Gagal memuat data Google Drive. Periksa koneksi atau URL Apps Script.</span>";
            });
        }

        function openFolder(folderId, folderName) {
            loadDriveData(folderId, folderName);
        }

        function renderUI() {
            const foldersGrid = document.getElementById('folders-grid');
            const filesContainer = document.getElementById('files-container');
            const folderSec = document.getElementById('folders-container');
            const filesSec = document.getElementById('files-section');
            const breadcrumbEl = document.getElementById('breadcrumb-container');

            breadcrumbEl.innerHTML = folderHistory.map((item, idx) => {
                if (idx === folderHistory.length - 1) {
                    return `<span class="font-semibold text-gray-800 dark:text-gray-100">${item.name}</span>`;
                }
                return `<span class="text-gray-500 dark:text-gray-400 hover:text-google-blue cursor-pointer transition" onclick="loadDriveData('${item.id}', '${item.name}')">${item.name}</span> <i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>`;
            }).join('');

            folderSec.style.display = driveFolders.length > 0 ? 'block' : 'none';
            filesSec.style.display = driveFiles.length > 0 ? 'block' : 'none';

            foldersGrid.innerHTML = driveFolders.map(f => `
                <div onclick="openFolder('${f.id}', '${f.name}')" class="flex items-center justify-between p-3.5 rounded-2xl border border-gray-200/80 dark:border-google-darkBorder bg-white dark:bg-google-darkSurface hover:shadow-md hover:border-transparent dark:hover:border-transparent cursor-pointer transition group">
                    <div class="flex items-center gap-3 truncate">
                        <div class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-google-blue">
                            <i class="fa-solid fa-folder text-base"></i>
                        </div>
                        <span class="text-xs font-semibold truncate text-gray-700 dark:text-gray-200 group-hover:text-google-blue transition">${f.name}</span>
                    </div>
                </div>
            `).join('');

            if (viewMode === 'grid') {
                filesContainer.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4";
                filesContainer.innerHTML = driveFiles.map(file => `
                    <div onclick="previewFile('${file.id}')" class="border border-gray-200/80 dark:border-google-darkBorder rounded-2xl bg-white dark:bg-google-darkSurface hover:shadow-lg hover:border-transparent dark:hover:border-transparent cursor-pointer transition overflow-hidden flex flex-col group">
                        <div class="h-32 bg-gray-50 dark:bg-[#25282a] flex items-center justify-center border-b border-gray-100 dark:border-gray-800 text-3xl">
                            <i class="${getFileIcon(file.type)} group-hover:scale-110 transition-transform duration-200"></i>
                        </div>
                        <div class="p-3.5 flex items-center justify-between">
                            <div class="truncate pr-2">
                                <h4 class="text-xs font-semibold truncate text-gray-700 dark:text-gray-200">${file.name}</h4>
                                <p class="text-[10px] text-gray-400 mt-1">${file.size}</p>
                            </div>
                            <span class="text-gray-400 group-hover:text-google-blue transition"><i class="fa-solid fa-ellipsis-vertical"></i></span>
                        </div>
                    </div>
                `).join('');
            } else {
                filesContainer.className = "flex flex-col space-y-2";
                filesContainer.innerHTML = driveFiles.map(file => `
                    <div onclick="previewFile('${file.id}')" class="flex items-center justify-between p-3 rounded-2xl border border-gray-200/80 dark:border-google-darkBorder bg-white dark:bg-google-darkSurface hover:bg-gray-50/80 dark:hover:bg-gray-800/50 cursor-pointer transition group">
                        <div class="flex items-center gap-3.5 truncate flex-1">
                            <div class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center">
                                <i class="${getFileIcon(file.type)} text-sm"></i>
                            </div>
                            <span class="text-xs font-semibold truncate text-gray-700 dark:text-gray-200 group-hover:text-google-blue transition">${file.name}</span>
                        </div>
                        <div class="text-xs text-gray-400 font-medium pl-4">${file.size}</div>
                    </div>
                `).join('');
            }
        }

        function getFileIcon(type) {
            if (type === 'pdf') return 'fa-solid fa-file-pdf text-red-500';
            if (type === 'sheet') return 'fa-solid fa-file-excel text-green-500';
            if (type === 'image') return 'fa-solid fa-file-image text-blue-500';
            return 'fa-solid fa-file-lines text-gray-400';
        }

        function previewFile(id) {
            const file = driveFiles.find(x => x.id === id);
            if (!file) return;

            document.getElementById('preview-title').innerText = file.name;
            document.getElementById('preview-download-btn').href = file.viewUrl;
            const area = document.getElementById('preview-content-area');
            
            if (file.type === 'image') {
                area.innerHTML = `<img src="${file.viewUrl}" class="max-h-full rounded-2xl shadow-md object-contain">`;
            } else {
                area.innerHTML = `
                    <div class="text-center p-8 flex flex-col items-center">
                        <div class="w-20 h-20 bg-blue-50 dark:bg-blue-900/20 rounded-3xl flex items-center justify-center text-google-blue text-4xl mb-4 shadow-inner">
                            <i class="${getFileIcon(file.type)}"></i>
                        </div>
                        <p class="font-semibold text-sm max-w-sm truncate">${file.name}</p>
                        <p class="text-xs text-gray-400 mt-1 mb-6">File siap dibuka atau diunduh langsung via Google Drive</p>
                        <a href="${file.viewUrl}" target="_blank" class="bg-google-blue hover:bg-google-hover text-white px-5 py-2.5 rounded-xl text-xs font-semibold transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-external-link"></i> Buka di Tab Baru
                        </a>
                    </div>
                `;
            }

            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function closePreview() { 
            document.getElementById('preview-modal').classList.add('hidden'); 
        }

        function openNewMenu() { 
            document.getElementById('new-dropdown').classList.toggle('hidden'); 
        }

        function triggerUploadFile() { 
            document.getElementById('new-dropdown').classList.add('hidden'); 
            document.getElementById('hidden-file-input').click(); 
        }

        function uploadFileScript(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1];
                document.getElementById('loading-indicator').style.display = 'flex';
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'upload', data: base64Data, name: file.name, mimeType: file.type, folderId: currentFolderId })
                }).then(() => {
                    fetchRootFoldersForSidebar();
                    loadDriveData(currentFolderId, folderHistory[folderHistory.length - 1].name);
                });
            };
            reader.readAsDataURL(file);
        }

        function openNewFolderModal() { 
            document.getElementById('new-dropdown').classList.add('hidden'); 
            document.getElementById('folder-modal').classList.remove('hidden'); 
        }

        function closeNewFolderModal() { 
            document.getElementById('folder-modal').classList.add('hidden'); 
        }

        function createFolderScript() {
            const name = document.getElementById('new-folder-name').value;
            if (!name) return;
            closeNewFolderModal();
            document.getElementById('loading-indicator').style.display = 'flex';
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'createFolder', name: name, folderId: currentFolderId })
            }).then(() => {
                fetchRootFoldersForSidebar();
                loadDriveData(currentFolderId, folderHistory[folderHistory.length - 1].name);
            });
        }
    </script>
</body>
</html>
